# Render reads this file and sets the service up from the repository.
services:
  - type: web
    name: clinic-front-desk-agent
    runtime: docker
    plan: free
    autoDeploy: false   # the live copy stays on its current build
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false   # asked for in the dashboard, never stored in the repository
      - key: PRELOAD_SAMPLES   # fill the queue with the sample calls at startup
        value: "1"
